<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engineering Factory v2.1 · 并发看板</title>
<style>
:root{--bg:#fafafa;--card:#fff;--border:#e5e5e5;--primary:#2563eb;--muted:#737373;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--mono:ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#1a1a1a;font:14px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;gap:10px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.logo{font-weight:700}.logo span{color:var(--primary)}
.badge{padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--border);color:var(--muted)}
.badge.live{color:var(--ok);border-color:var(--ok)}
.badge.pool{color:var(--primary);border-color:var(--primary);font-weight:700}
#counts{display:flex;gap:6px;font-size:12px}
#counts b{font-family:var(--mono)}
main{flex:1;display:grid;grid-template-columns:1fr 360px;overflow:hidden}
#left{display:flex;flex-direction:column;overflow:hidden}
#inputbar{padding:10px 20px;background:var(--card);border-bottom:1px solid var(--border);display:flex;gap:10px;flex-shrink:0}
#inp{flex:1;padding:9px 14px;border:1px solid var(--border);border-radius:10px;font:inherit;outline:none}
#inp:focus{border-color:var(--primary)}
#send{padding:9px 22px;border-radius:10px;border:0;background:var(--primary);color:#fff;font-weight:600;cursor:pointer}
#send:disabled{opacity:.5;cursor:wait}
/* 泳道 */
#lanes{flex:0 0 auto;overflow-y:auto;max-height:46%;padding:10px 20px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.lane{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:8px 12px;cursor:pointer}
.lane:hover{border-color:var(--primary)}
.lane.sel{border-color:var(--primary);box-shadow:0 0 0 3px #eff6ff}
.lane .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lane .idea{font-size:12.5px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.lane .meta{font-size:11px;color:var(--muted);font-family:var(--mono)}
.lane .chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.chipN{font-size:10.5px;font-family:var(--mono);border:1px solid var(--border);border-radius:6px;padding:1px 7px;color:var(--muted);background:#fff}
.chipN.done{border-color:#86efac;color:var(--ok)}
.chipN.running{border-color:var(--primary);color:var(--primary);font-weight:700}
.chipN.blocked{border-color:var(--err);color:var(--err);font-weight:700}
.st{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid}
.st.run{color:var(--primary);border-color:var(--primary)}
.st.blk{color:var(--err);border-color:var(--err)}
.st.ok{color:var(--ok);border-color:var(--ok)}
.st.pau{color:var(--muted)}
/* 详情 */
#detail{flex:1;overflow:hidden;display:flex;flex-direction:column;border-top:1px solid var(--border)}
#dhead{padding:8px 20px;background:var(--card);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0}
#dhead .t{font-weight:700;font-size:13px}
.mbtn{font-size:12px;padding:4px 12px;border-radius:7px;border:1px solid var(--border);background:#fff;cursor:pointer}
.mbtn:hover{background:#f5f7fa}
.mbtn.danger{border-color:var(--err);color:var(--err)}
#flow{flex:1;overflow-y:auto;padding:10px 20px;display:flex;flex-direction:column;gap:6px}
.ev{display:flex;gap:10px;align-items:flex-start;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
.ev .tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;flex-shrink:0;min-width:58px;text-align:center}
.tag.stage{background:#1a1a1a;color:#fff}.tag.check{background:#fef3c7;color:#92400e}
.tag.read{background:#eff6ff;color:var(--primary)}.tag.write{background:#f0fdf4;color:var(--ok)}
.tag.run{background:#fff7ed;color:var(--warn)}.tag.think{background:#fafaf9;color:#78716c;border:1px solid var(--border)}
.ev .body{font-family:var(--mono);font-size:12.5px;color:#404040;white-space:pre-wrap;word-break:break-all;padding-top:1px}
.ev.stage-ev .body{font-family:inherit;font-weight:600;font-size:13px}
.ev.check-ev .body{font-family:var(--mono);font-size:12px}
.ev.block-ev .body{color:var(--err);font-family:inherit;font-weight:700}
/* 项目管理面板 */
#projPanel{display:none;flex:1;overflow-y:auto;padding:14px 20px}
/* 右侧产物 */
#right{background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#right h3{font-size:12px;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--border)}
#arts{flex:1;overflow-y:auto;padding:8px 12px}
.art{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12px;padding:4px 8px;border-radius:6px;background:#f9fafb;margin-bottom:3px;cursor:pointer;color:#525252}
.art:hover{background:#eff6ff;color:var(--primary)}
.art .doc{color:var(--primary);font-weight:600}
.art .sz{color:#a3a3a3;font-size:10.5px}
.art.isdir{background:#f3f4f6;cursor:default;font-weight:600}
#fileview{max-height:42%;overflow-y:auto;border-top:1px solid var(--border);padding:10px 14px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;color:#404040;background:#fcfcfc;line-height:1.7}
footer{background:var(--card);border-top:1px solid var(--border);padding:5px 20px;font-size:12px;color:var(--muted);flex-shrink:0}
</style>
</head>
<body>
<header>
  <div class="logo">🏭 Engineering <span>Factory</span> v2.1 · 并发执行制</div>
  <span class="badge pool" id="poolBadge">并发 0/3</span>
  <div id="counts"></div>
  <div style="flex:1"></div>
  <div class="ptab on" id="tabRun" style="padding:6px 14px;font-size:13px;cursor:pointer;color:var(--primary);font-weight:600;border-bottom:2px solid var(--primary)">▶ 并发看板</div>
  <div class="ptab" id="tabProj" style="padding:6px 14px;font-size:13px;cursor:pointer;color:var(--muted)">🗂 项目管理</div>
</header>
<main>
  <div id="left">
    <div id="inputbar">
      <input id="inp" placeholder="产品想法，例：做一个记账小应用，支持分类统计和月度报表…（多个任务可并行跑）" autocomplete="off">
      <button id="send">🚀 立项开工</button>
    </div>
    <div id="lanes"><div style="font-size:12px;color:var(--muted)">暂无在管 run —— 输入想法开工，或等待历史 run 恢复</div></div>
    <div id="detail">
      <div id="dhead"><span class="t" id="dtitle">选择一条泳道查看详情</span><div style="flex:1"></div><span id="dops"></span></div>
      <div id="flow"><div class="ev"><span class="tag stage">START</span><div class="body">并发模型：多个任务并行推进，互不排队；单任务内部仍是节点串行流水线，验收不过即停（⛔）。</div></div></div>
    </div>
    <div id="projPanel"><div id="runlist"></div></div>
  </div>
  <div id="right">
    <h3>📦 产物（实际路径 · 点击查看 / 预览）</h3>
    <div id="arts"><div style="font-size:12px;color:var(--muted)">…</div></div>
    <div id="fileview">…</div>
  </div>
</main>
<footer>多 run 并发（MAX_CONCURRENT 可配）· 节点状态持久化(nodes.json) · 验收判据磁盘实测，不信 Agent 自报</footer>
<script>
const $=id=>document.getElementById(id);
const ICON={pending:'○',running:'⏳',done:'✅',blocked:'⛔',paused:'⏸'};
const TAG={Read:['read','📋'],Write:['write','✍️'],Edit:['write','✍️'],Bash:['run','▶️']};
let sel=null,selEvents=0,state=null;
const fmtMs=ms=>ms==null?'':(ms<60000?Math.round(ms/1000)+'s':Math.floor(ms/60000)+'m'+Math.round(ms%60000/1000)+'s');
const esc=t=>(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== 看板渲染 ===== */
function renderLanes(runs){
  if(!runs||!runs.length){$('lanes').innerHTML='<div style="font-size:12px;color:var(--muted)">暂无在管 run —— 输入想法开工</div>';return}
  $('lanes').innerHTML=runs.map(r=>{
    const st=r.executing?'<span class="st run">▶ 执行中</span>':r.blocked?'<span class="st blk">⛔ 阻断</span>':r.awaiting?'<span class="st blk" style="color:var(--warn);border-color:var(--warn)">⏸ 待确认</span>':r.done?'<span class="st ok">✅ 交付</span>':'<span class="st pau">⏸ 暂停</span>';
    const chips=r.nodes.map((s,i)=>`<span class="chipN ${s}">${ICON[s]||s} ${NODE_NAMES[r.flow]?(NODE_NAMES[r.flow][i]||s):s}</span>`).join('');
    const la=r.lastAction?`<span class="meta" title="${esc(r.lastAction.text)}">最近: ${esc((r.lastAction.text||'').slice(0,42))}</span>`:'';
    return `<div class="lane ${sel===r.id?'sel':''}" data-id="${r.id}" onclick="selectRun('${r.id}')">
      <div class="hd">${st}<span class="idea" title="${esc(r.idea)}">${esc(r.idea.slice(0,60))}</span>
        <span class="meta">节点: ${esc(r.currentNode)}</span>
        <span class="meta">${r.nodeElapsedMs?'⏱ '+fmtMs(r.nodeElapsedMs):''}</span>${la}</div>
      <div class="chips">${chips}</div></div>`}).join('');
}
const NODE_NAMES={build:['立项','PRD','原型','方案','拆解','开发','QA','交付'],fix:['工单','勘察','根因','修复','回归','交付'],iterate:['迭代','PRD','拆解','开发','QA','交付']};
function renderCounts(runs,conc){
  if(conc)$('poolBadge').textContent=`并发 ${conc.executing}/${conc.max}`;
  const c={exec:0,pau:0,blk:0,done:0};
  (runs||[]).forEach(r=>{r.executing?c.exec++:r.blocked?c.blk++:r.done?c.done++:c.pau++});
  $('counts').innerHTML=`<span>🟢 执行 <b>${c.exec}</b></span><span>⏸ 暂停 <b>${c.pau}</b></span><span>⛔ 阻断 <b>${c.blk}</b></span><span>✅ 交付 <b>${c.done}</b></span>`;
}
function addEv(tag,cls,text,extra){
  const d=document.createElement('div');d.className='ev '+(extra||'');
  d.innerHTML=`<span class="tag ${cls}">${tag}</span>`;const b=document.createElement('div');b.className='body';b.textContent=text;d.appendChild(b);
  $('flow').appendChild(d);$('flow').scrollTop=1e9;
}
function opsFor(run){
  if(!run)return'';
  let h='';
  if(run.awaiting&&!run.executing){
    h+=`<button class="mbtn" style="border-color:var(--ok);color:var(--ok)" onclick="approveRun('${run.id}','go')">✅ 原型确认 · 放行</button> `;
    h+=`<button class="mbtn" style="border-color:var(--warn);color:var(--warn)" onclick="approveRun('${run.id}','redo')">🔁 打回重做</button> `;
  }
  if(run.nodes.some(n=>n.status==='blocked')&&!run.executing)h+=`<button class="mbtn" onclick="retryRun('${run.id}')">👤 重试阻断节点</button> `;
  if(!run.executing)h+=`<button class="mbtn danger" onclick="delRun('${run.id}')">🗑 删除</button> `;
  const idx=run.artifacts&&run.artifacts.some(a=>/\.html$/.test(a.name)&&a.type!=='dir');
  if(idx)h+=`<button class="mbtn" onclick="window.open('/preview/${run.id}/index.html','_blank')">👁 预览</button>`;
  return h;
}
function renderDetail(run){
  if(!run){$('dtitle').textContent='选择一条泳道查看详情';$('dops').innerHTML='';return}
  $('dtitle').textContent=run.idea.slice(0,44)+(run.idea.length>44?'…':'');
  $('dops').innerHTML=opsFor(run);
  const evs=run.events||[];
  if(evs.length!==selEvents){ // 事件流增量渲染
    if(evs.length<selEvents){$('flow').innerHTML='';selEvents=0}
    for(const e of evs.slice(selEvents)){
      if(e.type==='flow')addEv('路由','stage',e.text,'stage-ev');
      else if(e.type==='node_start')addEv('节点','stage',`${e.owner} 开始「${e.name||e.node}」（交付：${e.deliverable||'—'}）`,'stage-ev');
      else if(e.type==='node_exec_done')addEv('回执','think',(e.text||'').slice(0,400));
      else if(e.type==='node_check')addEv('验收','check',(e.pass?'✅ ':'⛔ ')+(e.deliverable||'')+' — '+e.detail,'check-ev');
      else if(e.type==='pipeline_blocked')addEv('阻断','stage',e.text,'block-ev');
      else if(e.type==='pipeline_awaiting')addEv('确认闸','stage','⏸ '+e.text,'stage-ev');
      else if(e.type==='tool'){const[cls,label]=TAG[e.tool]||['think','💬'];addEv(label,cls,e.brief)}
      else if(e.type==='text')addEv('💬','think',e.text);
      else if(e.type==='all_done')addEv('完成','stage',e.text,'stage-ev');
    }
    selEvents=evs.length;
  }
  renderArts(run.artifacts,run.id);
}
/* ===== 产物（实际路径树） ===== */
function kindOf(name,type){
  if(type==='dir')return['📁','目录'];
  if(name.endsWith('PRD.md'))return['📋','产品需求'];if(name.endsWith('TechSpec.md'))return['📐','技术方案'];
  if(name.endsWith('DIAGNOSIS.md'))return['🔍','根因诊断'];if(name.endsWith('SURVEY.md'))return['🧭','现场勘察'];
  if(name.endsWith('QA-Report.md'))return['✅','验收报告'];if(name.endsWith('DELIVERY.md'))return['📦','交付说明'];
  if(name.endsWith('manifest.json'))return['🪪','运行身份'];if(name.endsWith('events.jsonl'))return['🔁','过程记录'];
  if(name.endsWith('.md'))return['📄','文档'];
  if(name.endsWith('.html'))return name.includes('prototype')?['🎨','交互原型 · 可预览']:['🌐','产品页面 · 可预览'];
  if(name.endsWith('.json'))return['🗂','任务合同'];
  if(/\.(js|mjs|css)$/.test(name))return['⌨️','代码'];
  return['📎','文件'];
}
function renderArts(arts,runId){
  arts=arts||[];
  if(!arts.length){$('arts').innerHTML='<div style="font-size:12px;color:var(--muted)">（暂无产物）</div>';return}
  // 按真实路径分层缩进：llmwiki/PRD.md → 一级目录行 + 二级文件行
  let h='';
  for(const a of arts){
    const depth=a.name.split('/').length-1;
    const[ico,kind]=kindOf(a.name,a.type);
    const nm=a.name.split('/').pop();
    if(a.type==='dir')h+=`<div class="art isdir" style="padding-left:${8+depth*14}px">${ico} ${esc(nm)}/</div>`;
    else h+=`<div class="art" data-n="${esc(a.name)}" data-run="${runId}" style="padding-left:${8+depth*14}px" title="${esc(a.name)}（${kind}）">
      <span class="doc">${ico} ${esc(nm)}</span><span class="sz">${esc(a.name.split('/').slice(0,-1).join('/'))}${a.size!=='dir'?' · '+a.size:''}</span></div>`;
  }
  $('arts').innerHTML=h;
  document.querySelectorAll('.art[data-n]').forEach(e=>e.onclick=async()=>{
    const n=e.dataset.n,rid=e.dataset.run;
    if(n.endsWith('.html')){window.open('/preview/'+rid+'/'+encodeURIComponent(n),'_blank');return}
    try{
      $('fileview').innerHTML='加载中…';
      const c=await(await fetch('/api/file?name='+encodeURIComponent(n)+'&id='+rid)).json();
      if(n.endsWith('.md'))$('fileview').innerHTML='<div style="font-size:11px;color:#a3a3a3;margin-bottom:6px">📄 '+esc(n)+'</div>'+mdToHtml(c.content||'(空)');
      else if(n.endsWith('.jsonl'))$('fileview').textContent=(c.content||'').split('\n').slice(-30).join('\n');
      else $('fileview').textContent=c.content||'(空)';
    }catch(_){$('fileview').textContent='(不可读)'}
  });
}
function mdToHtml(md){
  const escT=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let h=escT(md);
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre style="background:#f5f5f5;border:1px solid #e5e5e5;border-radius:6px;padding:8px;overflow-x:auto;font-size:11px">'+c+'</pre>');
  h=h.replace(/^###### (.*)$/gm,'<h6>$1</h6>').replace(/^##### (.*)$/gm,'<h5>$1</h5>')
     .replace(/^#### (.*)$/gm,'<h4 style="margin:10px 0 4px">$1</h4>').replace(/^### (.*)$/gm,'<h3 style="margin:12px 0 4px">$1</h3>')
     .replace(/^## (.*)$/gm,'<h2 style="margin:14px 0 6px;font-size:15px">$1</h2>').replace(/^# (.*)$/gm,'<h1 style="margin:14px 0 8px;font-size:17px">$1</h1>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul style="margin:4px 0 4px 16px">$1</ul>');
  return h.replace(/\n{2,}/g,'<br><br>');
}
/* ===== 轮询主循环 ===== */
async function tick(){
  try{
    const d=await(await fetch('/api/state')).json();
    state=d;
    renderCounts(d.runs,d.concurrency);
    renderLanes(d.runs);
    if(!sel&&d.run)selectRun(d.run.id,true);
    else if(sel){
      if(d.run&&d.run.id===sel)renderDetail(d.run);
      else{const r=await fetch('/api/state?id='+encodeURIComponent(sel)).then(r=>r.json()).catch(()=>null);
        if(r&&r.run)renderDetail(r.run);else if(r&&r.error){sel=null;selEvents=0;$('flow').innerHTML='';}}
    }
  }catch(e){}
}
window.selectRun=(id,silent)=>{sel=id;selEvents=0;$('flow').innerHTML='';document.querySelectorAll('.lane').forEach(e=>e.classList.toggle('sel',e.dataset.id===id));tick()};
setInterval(tick,4000);tick();
/* ===== 操作 ===== */
window.approveRun=async(id,d)=>{
  let feedback='';
  if(d==='redo'){feedback=prompt('打回原型：反馈会拼进重做 prompt（例如：改成深色主题、首页加统计卡）','')||'';if(feedback===null)return}
  else if(!confirm('确认原型方向 OK，放行进入技术方案与开发？'))return;
  const r=await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,decision:d,feedback})});
  if(r.status!==200){const e=await r.json().catch(()=>({}));addEv('确认闸','stage','⛔ '+(e.error||'失败'),'block-ev');return}
  addEv('确认闸','stage',d==='go'?'✅ 已放行':'🔁 已打回重做','stage-ev');tick();
};
window.retryRun=async id=>{
  const r=await fetch('/api/retry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  if(r.status!==200){const e=await r.json().catch(()=>({}));addEv('重试','stage','⛔ '+(e.error||'失败'),'block-ev');return}
  addEv('重试','stage','👤 已触发重试','stage-ev');tick();
};
window.delRun=async id=>{
  if(!confirm('彻底删除 '+id+'（含代码与证据，不可恢复）？'))return;
  const r=await(await fetch('/api/runs/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})})).json();
  if(r.ok&&sel===id){sel=null;selEvents=0;$('flow').innerHTML='';}
  tick();
};
async function go(){
  const idea=$('inp').value.trim();if(!idea)return;
  $('inp').value='';$('send').disabled=true;$('send').textContent='⏳ 提交中…';
  try{
    const r=await fetch('/api/mission',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea})});
    if(r.status===422){const e=await r.json();addEv('拒收','stage','⛔ '+e.error,'block-ev')}
    else if(r.status===409){const e=await r.json();addEv('并发满','stage','⛔ '+e.error+' — 稍后再提交或调 MAX_CONCURRENT','block-ev')}
    else if(r.status===200){addEv('受理','stage','🟢 任务已受理，看板将出现新泳道','stage-ev');
      // 轻量读取流首行拿 runId 并立即选中
      const reader=r.body.getReader(),dec=new TextDecoder();const{value}=await reader.read();
      try{await reader.cancel()}catch(e){}
      tick();
    }
  }catch(err){addEv('ERROR','stage',''+err,'block-ev')}
  $('send').disabled=false;$('send').textContent='🚀 立项开工';
}
$('send').onclick=go;$('inp').onkeydown=e=>{if(e.key==='Enter')go()};
/* ===== 项目管理 ===== */
const FLOWN={build:'🟢 立项开发',fix:'🔧 运维修复',iterate:'🔁 迭代开发'};
const STN={delivered:'✅ 已交付',blocked:'⛔ 阻断中',running:'▶️ 执行中',paused:'⏸ 暂停'};
async function loadRuns(){
  try{
    const d=await(await fetch('/api/projects')).json();
    const all=(await(await fetch('/api/runs')).json()).runs;
    const runsWithoutProj=all.filter(r=>!(d.projects||[]).some(p=>p.runs&&p.runs.includes(r.id)));
    $('runlist').innerHTML='<div style="font-size:12px;color:var(--muted);margin-bottom:10px">已立项项目 · 迭代 / 回滚 / 删除</div>'+
    (d.projects||[]).map(p=>`
      <div style="border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b>🗂 ${p.id}</b><span style="font-size:13px">${p.name}</span>
          <span style="font-size:11px;color:var(--muted)">📊 ${(p.runs||[]).length} 个任务</span></div>
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">
        ${(p.runs||[]).map(r=>`
          <div style="display:flex;align-items:center;gap:8px;border-left:3px solid ${r.status==='delivered'?'var(--ok)':r.status==='blocked'?'var(--err)':'var(--border)'};padding:4px 10px;background:#fafafa;border-radius:6px;flex-wrap:wrap">
            <span style="font-family:var(--mono);font-size:11.5px">${r.id}</span>
            <span style="font-size:11px;color:var(--muted)">${FLOWN[r.flow]||r.flow}</span>
            <span style="font-size:11px;color:${r.status==='delivered'?'var(--ok)':r.status==='blocked'?'var(--err)':'var(--muted)'}">${STN[r.status]||r.status}</span>
            <span style="font-size:11.5px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((r.idea||'').slice(0,40))}</span>
            ${r.flow==='build'&&r.status==='delivered'?`<button class="mbtn" style="border-color:var(--primary);color:var(--primary)" onclick="iterRun('${r.id}')">🔁迭代</button>
            <button class="mbtn" style="border-color:var(--warn);color:var(--warn)" onclick="rbRun('${r.id}')">↩️回滚</button>`:''}
            <button class="mbtn" style="border-color:var(--err);color:var(--err)" onclick="delRun('${r.id}')">🗑删任务</button>
          </div>`).join('')||'<div style="font-size:12px;color:var(--muted)">（无任务记录）</div>'}
        </div>
        <div style="margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <input id="rm-${p.id}" value="${esc(p.remote||'')}" placeholder="https://github.com/user/repo（绑远程后交付自动推送）" style="flex:1;min-width:220px;font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-family:var(--mono)">
          <button class="mbtn" onclick="bindRemote('${p.id}')">🔗 绑远程</button>
          <button class="mbtn" onclick="bindRemote('${p.id}',true)" title="清空即解绑">解绑</button>
        </div>
        <div style="margin-top:8px;display:flex;gap:8px">
          <button class="mbtn danger" onclick="delProj('${p.id}',${(p.runs||[]).length})">🗑 删除整个项目（${(p.runs||[]).length} 任务+产品代码全部清零）</button>
        </div>
      </div>`).join('')
    +runsWithoutProj.map(r=>`
      <div style="border:1px dashed var(--border);border-radius:10px;padding:8px 14px;margin-bottom:8px">
        <span style="font-family:var(--mono);font-size:12px">${r.id}</span> <span style="font-size:11px;color:var(--muted)">${FLOWN[r.flow]} · 孤儿任务（未挂项目）</span>
        <button class="mbtn" style="border-color:var(--err);color:var(--err);float:right" onclick="delRun('${r.id}')">🗑删任务</button>
      </div>`).join('');
  }catch(e){$('runlist').innerHTML='<div style="color:var(--err);font-size:12px">加载失败</div>'}
}
window.bindRemote=async(id,clear)=>{
  const remote=clear?'':(document.getElementById('rm-'+id).value.trim());
  const r=await(await fetch('/api/projects/remote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,remote})})).json().catch(()=>({}));
  if(r.error)alert('绑定失败：'+r.error);else{alert(remote?'已绑定 '+remote:'已解绑');loadRuns()}
};
window.delProj=async(id,n)=>{
  if(!confirm('删除项目 '+id+'：将删除 '+n+' 个任务与产品代码，不可恢复。确认？'))return;
  const r=await(await fetch('/api/projects/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})})).json();
  loadRuns();tick();
};
window.iterRun=id=>{
  const idea=prompt('迭代需求（对 '+id+' 的产品做增量开发，外科式最小改动）：','');
  if(!idea)return;
  showTab('run');
  fetch('/api/mission',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea,__iterate:id})}).catch(()=>{});
  // 走正式迭代接口：
  fetch('/api/runs/iterate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,idea})}).then(()=>tick());
};
window.rbRun=async id=>{
  if(!confirm('回滚 '+id+' 的最近一次 git 提交？(git revert，可再撤回)'))return;
  await fetch('/api/runs/rollback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  loadRuns();
};
function showTab(t){
  $('tabRun').style.cssText=t==='run'?'padding:6px 14px;font-size:13px;cursor:pointer;color:var(--primary);font-weight:600;border-bottom:2px solid var(--primary)':'padding:6px 14px;font-size:13px;cursor:pointer;color:var(--muted)';
  $('tabProj').style.cssText=t==='proj'?'padding:6px 14px;font-size:13px;cursor:pointer;color:var(--primary);font-weight:600;border-bottom:2px solid var(--primary)':'padding:6px 14px;font-size:13px;cursor:pointer;color:var(--muted)';
  $('projPanel').style.display=t==='proj'?'block':'none';
  ['inputbar','lanes','detail'].forEach(x=>$(x).style.display=t==='run'?'':'none');
  if(t==='proj')loadRuns();
}
$('tabRun').onclick=()=>showTab('run');$('tabProj').onclick=()=>showTab('proj');
</script>
</body>
</html>
