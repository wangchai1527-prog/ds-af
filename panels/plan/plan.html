<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idea Plan 分析台 · 分析到立项</title>
<style>
:root{--bg:#fafafa;--card:#fff;--border:#e5e5e5;--primary:#7c3aed;--muted:#737373;--ok:#16a34a;--warn:#d97706;--err:#dc2626;--mono:ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#1a1a1a;font:14px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--card);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;gap:12px;align-items:center;flex-shrink:0}
#sbt{width:30px;height:30px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:15px;line-height:1;color:var(--muted);flex-shrink:0}
#sbt:hover{border-color:var(--primary);color:var(--primary)}
.logo{font-weight:700}.logo span{color:var(--primary)}
.sub{font-size:12px;color:var(--muted)}
main{flex:1;display:flex;overflow:hidden}
/* 左：会话列表 */
#side{width:320px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
#mask{display:none}
#newbar{padding:10px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
#idea{width:100%;height:64px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;resize:vertical;outline:none}
#idea:focus{border-color:var(--primary)}
#newbtn{padding:8px;border-radius:8px;border:0;background:var(--primary);color:#fff;font-weight:600;cursor:pointer}
#newbtn:disabled{opacity:.5}
#filters{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
#mgmt{display:flex;gap:6px;padding:6px 0;flex-wrap:wrap}
#mgmt:empty{display:none}
.mb{padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px}
.mb:hover{border-color:var(--primary)}
.mb.danger{color:#b91c1c;border-color:#fca5a5}
.mb[disabled]{opacity:.6;cursor:default}
.fbtn{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);cursor:pointer;color:var(--muted);background:#fff}
.fbtn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
#list{flex:1;overflow-y:auto;padding:8px}
.ses{border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer;background:#fff}
.ses:hover{border-color:var(--primary)}
.ses.sel{border-color:var(--primary);box-shadow:0 0 0 3px #f5f3ff}
.ses .idea{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ses .meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:8px}
/* 侧边栏分组头：可折叠（▾/▸ + 计数） */
.tg-head{font-size:11.5px;color:var(--muted);padding:7px 4px 3px;font-weight:600;cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px}
.tg-head:hover{color:var(--primary)}
.tg-head .cnt{font-weight:400}
/* 侧边栏会话卡快捷管理（悬停浮现：改名/删除） */
.ses .qa{display:none;margin-left:auto;gap:4px}
.ses:hover .qa{display:inline-flex}
.ses .qa span{cursor:pointer;padding:0 3px;border-radius:4px;font-size:11px}
.ses .qa span:hover{background:#f5f3ff;color:var(--primary)}
.ses .qa span.del:hover{background:#fee2e2;color:var(--err)}
.stt{font-size:10.5px;padding:1px 8px;border-radius:999px;border:1px solid}
.stt.open{color:var(--primary);border-color:var(--primary)}
.stt.awaiting{color:var(--warn);border-color:var(--warn)}
.stt.go{color:var(--ok);border-color:var(--ok)}
.stt.go.fix{color:var(--warn);border-color:var(--warn)}
.stt.no-go,.stt.park{color:var(--muted)}
/* 右：工作区 */
#work{flex:1;display:flex;flex-direction:column;overflow:hidden}
#top{padding:10px 18px;background:var(--card);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#top .idea{font-weight:700;font-size:14px}
#tabs{display:flex;gap:2px;padding:6px 18px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin}
.tb{font-size:12.5px;padding:5px 14px;cursor:pointer;color:var(--muted);border-radius:8px 8px 0 0;white-space:nowrap;flex-shrink:0}
.tb.on{color:var(--primary);font-weight:700;box-shadow:inset 0 -2px var(--primary)}
#pane{flex:1;overflow-y:auto;padding:14px 18px;min-width:0}
.doc{font-size:13px;white-space:pre-wrap;line-height:1.8}
.doc h1,.doc h2,.doc h3{margin:12px 0 4px}
/* 决策点表 */
.dt{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 14px;background:#fff}
.dt th,.dt td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
.dt th{background:#f5f3ff;color:var(--primary);font-size:12px}
.opt{display:inline-block;margin:2px 4px 2px 0;padding:3px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;background:#fff}
.opt:hover{border-color:var(--primary)}
.opt.pick{background:var(--primary);color:#fff;border-color:var(--primary)}
.opt.rec::after{content:' ★推荐';color:var(--warn);font-size:10px}
.opt.pick.rec::after{color:#fde68a}
#replybar{border-top:1px solid var(--border);background:var(--card);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;flex-shrink:0}
#msg{width:100%;height:52px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font:inherit;resize:none;outline:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#send{padding:7px 20px;border-radius:8px;border:0;background:var(--primary);color:#fff;font-weight:600;cursor:pointer}
#send:disabled{opacity:.5}
.b.go{background:#dcfce7;color:var(--ok);border-color:var(--ok)}
.b.fix{background:#ffedd5;color:var(--warn);border-color:var(--warn)}
.b.no{background:#fee2e2;color:var(--err);border-color:var(--err)}
.b.pk{background:#f3f4f6;color:var(--muted);border-color:var(--border)}
#matrow{display:flex;gap:6px;align-items:center}
#matToggle{display:none;font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer}
#matfn{width:160px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px}
#matct{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px}
.mats{font-size:11px;color:var(--muted)}
#events{max-height:110px;overflow-y:auto;font-family:var(--mono);font-size:10.5px;color:#9a9a9a;padding:4px 8px;background:#fafaf9;border-radius:6px;display:none}
footer{background:var(--card);border-top:1px solid var(--border);padding:4px 20px;font-size:11.5px;color:var(--muted);flex-shrink:0}
/* 桌面：左侧栏折叠 */
@media (min-width:861px){ body.noside #side{display:none} }
/* 窄屏自适应：侧栏变抽屉，工作区独占 */
@media (max-width:860px){
  #side{position:fixed;top:0;bottom:0;left:0;z-index:50;width:min(300px,84vw);border-right:0;transform:translateX(-100%);transition:transform .2s ease;box-shadow:4px 0 24px rgba(0,0,0,.15)}
  body.side-open #side{transform:none}
  body.side-open #mask{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
  .sub{display:none}
  #top{padding:8px 12px}
  #tabs{padding:6px 12px}
  #pane{padding:10px 12px}
  #replybar{padding:10px 12px}
  #replybar{max-height:48dvh;overflow-y:auto}
  #msg{height:42px}
  #matrow{display:none}
  body.mat-open #matrow{display:flex}
  #matrow{flex-wrap:wrap}
  #matfn{width:120px}
  #matToggle{display:inline-block}
  .dt{font-size:11.5px}
  .dt th,.dt td{padding:5px 7px}
  footer{display:none}
}
</style>
</head>
<body>
<header>
  <button id="sbt" onclick="toggleSide()" title="折叠/展开会话列表">☰</button>
  <div class="logo">💡 Idea <span>Plan</span> 分析台</div>
  <div class="sub">分析到立项 · 人 reply 才跑一轮 · 磁盘唯一真源（逐轮只增不改）</div>
</header>
<main>
  <div id="mask" onclick="toggleSide(true)"></div>
  <div id="side">
    <div id="newbar">
      <div class="row" style="gap:6px">
        <select id="topicSel" title="话题目录（会话归属，杜绝漂移）" style="flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:8px;font:inherit;font-size:12.5px;background:#fff"></select>
        <input id="topicNew" placeholder="新话题目录名（≤40字）" style="display:none;flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px">
      </div>
      <textarea id="idea" placeholder="想法，例：给工厂做个并发流水线观测面板的预研分析…（会自动跑第 1 轮，并与近 10 条历史分析比对防重复立项）"></textarea>
      <button id="newbtn">🌱 新建分析会话</button>
    </div>
    <div id="filters"></div>
    <div id="list"><div style="font-size:12px;color:var(--muted);padding:6px">…</div></div>
  </div>
  <div id="work">
    <div id="top"><span class="idea" id="tidea">选择或新建一个分析会话</span><span id="tstate"></span><button class="mb" id="rnb" style="display:none" onclick="renameTopic()" title="修改话题名（1–80 字）">✏️ 改名</button></div>
    <div id="mgmt"></div><!-- 话题管理动作栏：全话题统一按钮组（提交开发/整改·搁置·否决·删除），已立项前置 🏭徽章 -->
    <div id="tabs">
      <div class="tb on" data-t="round">📋 本轮决策点</div>
      <div class="tb" data-t="IDEA">💡 IDEA</div>
      <div class="tb" data-t="RESEARCH">🔬 RESEARCH</div>
      <div class="tb" data-t="BRIEF">📦 BRIEF</div>
      <div class="tb" data-t="rounds">🗂 全部轮次</div>
    </div>
    <div id="pane"><div style="color:var(--muted);font-size:13px">等待会话…</div></div>
    <div id="replybar">
      <div class="row" id="replyrow">
        <textarea id="msg" placeholder="拍板补充 / 追问 / 喂料后的说明（点选上方决策点选项后连同提交）"></textarea>
        <div id="matrow">
          <input id="matfn" placeholder="材料文件名.md"><input id="matct" placeholder="粘贴材料内容（可选，随 reply 入 materials/）">
        </div>
        <div class="row"><button id="matToggle" onclick="document.body.classList.toggle('mat-open')">📎 材料</button><button id="send">📨 提交 reply（触发下一轮）</button><span class="mats" id="matlist"></span><span class="mats" id="hint"></span></div>
      </div>
      <div id="events"></div>
    </div>
  </div>
</main>
<footer>动作栏全话题统一：🚀提交开发 · 🔧提交升级整改 · 🅿️搁置 · ❌否决 · 🗑删除话题（已立项话题另前置 🏭徽章）｜继续对话 = reply 续轮，目的就是再次提交：已立项后 🔧整改直建新 run 并累积 📜run 历史｜话题目录：会话挂 analyses/&lt;话题&gt;/ 下，侧边栏分组可折叠（悬停会话卡出 ✏️改名/🗑删除）</footer>
<script>
const $=id=>document.getElementById(id);
const esc=t=>(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=null,tab='round',filter='all',pick={},curIdea='';
/* 左侧栏：桌面折叠（记忆）· 窄屏抽屉 */
const mqNarrow=matchMedia('(max-width:860px)');
window.toggleSide=(closeOnly)=>{
  if(mqNarrow.matches){closeOnly?document.body.classList.remove('side-open'):document.body.classList.toggle('side-open')}
  else{const now=document.body.classList.toggle('noside');try{localStorage.setItem('planside-noside',now?'1':'0')}catch(e){}}
};
try{if(localStorage.getItem('planside-noside')==='1')document.body.classList.add('noside')}catch(e){}
const STN={open:'🟣 分析中',awaiting:'🟡 待拍板',go:'🟢 已提交 · 开发',park:'⚪ 搁置','no-go':'⚪ 否决'};
/* go 态徽章两种文案：build=开发 / fix=整改（带 spawnedRuns 数量）；旧数据无 submitMode 按 build 兜底 */
const stTxt=(st,sm,n)=>st==='go'?(sm==='fix'?`🟠 已提交 · 整改${n?`（${n} runs）`:''}`:'🟢 已提交 · 开发'):(STN[st]||st);
const stSpan=(st,sm,n)=>`<span class="stt ${st==='go'&&sm==='fix'?'go fix':st}">${stTxt(st,sm,n)}</span>`;
const FLOWS=[['all','全部'],['open','分析中'],['awaiting','待拍板'],['go','已提交'],['park','搁置'],['no-go','否决']];

function renderFilters(){$('filters').innerHTML=FLOWS.map(([k,l])=>`<span class="fbtn ${filter===k?'on':''}" onclick="setF('${k}')">${l}</span>`).join('')}
window.setF=k=>{filter=k;renderFilters();loadList()};
/* 话题目录选择器：已有话题下拉 + 「＋新建话题…」切输入框（新建会话必带归属，杜绝漂移） */
const NEW_T='__new__';
let lastTopics=[];
function renderTopics(){
  const sel=$('topicSel'),inp=$('topicNew');
  const prevNew=inp.style.display!=='none',prev=prevNew?null:sel.value;
  const opts=lastTopics.filter(t=>t!=='未分组'); // 「未分组」= 历史老会话保留桶，不可作为新归属选
  sel.innerHTML=opts.map(t=>`<option value="${esc(t)}">📁 ${esc(t)}</option>`).join('')
    +`<option value="${NEW_T}">＋ 新建话题…</option>`;
  sel.onchange=()=>{const isNew=sel.value===NEW_T;inp.style.display=isNew?'block':'none';if(isNew)inp.focus()};
  if(prevNew){sel.value=NEW_T;inp.style.display='block'}
  else if(prev&&opts.includes(prev))sel.value=prev;
  if(!opts.length){sel.value=NEW_T;inp.style.display='block';inp.placeholder='首个话题目录名（会话归属）'}
}
const curTopic=()=>{const s=$('topicSel'),i=$('topicNew');
  return s.value===NEW_T?(i.value.trim()||''):s.value};
async function loadList(){
  const d=await(await fetch('/api/analyses')).json().catch(()=>({analyses:[]}));
  const all=d.analyses||[];
  const topics=[...new Set(all.map(a=>a.topic||'未分组'))];
  if(topics.join('|')!==lastTopics.join('|')){lastTopics=topics;renderTopics()}
  const arr=all.filter(a=>filter==='all'||a.state===filter);
  /* 按话题目录分组渲染：新建与历史会话同栏管理；分组头可折叠（记忆）· 会话卡悬停出快捷管理 */
  const groups={};for(const a of arr)(groups[a.topic||'未分组']=groups[a.topic||'未分组']||[]).push(a);
  const keys=Object.keys(groups).sort((x,y)=>(x==='未分组')-(y==='未分组')||x.localeCompare(y));
  let collapsed={};try{collapsed=JSON.parse(localStorage.getItem('plan-tg-collapsed')||'{}')}catch(e){}
  window.tgToggle=t=>{collapsed[t]=!collapsed[t];try{localStorage.setItem('plan-tg-collapsed',JSON.stringify(collapsed))}catch(e){};loadList()};
  $('list').innerHTML=arr.length?keys.map(t=>`
    <div class="tg-head" onclick="tgToggle(${JSON.stringify(t)})">${collapsed[t]?'▸':'▾'} 📁 ${esc(t)}<span class="cnt">（${groups[t].length}）</span></div>`+
    (collapsed[t]?'':groups[t].map(a=>`
    <div class="ses ${cur===a.id?'sel':''}" onclick="selSes('${a.id}')">
      <div class="idea">${a.parent?'<span title="续接会话" style="color:var(--primary)">🔁 </span>':''}${esc(a.idea)}</div>
      <div class="meta">${stSpan(a.state,a.submitMode,a.spawnedRuns)}<span>第 ${a.round} 轮</span><span>${(a.updated||'').slice(5,16).replace('T',' ')}</span>
        <span class="qa"><span title="改名" onclick="event.stopPropagation();renameTopic('${a.id}')">✏️</span><span class="del" title="删除（未立项时可用）" onclick="event.stopPropagation();delTopic('${a.id}')">🗑</span></span></div>
    </div>`).join(''))).join(''):'<div style="font-size:12px;color:var(--muted);padding:6px">（无会话）</div>';
}
window.selSes=id=>{cur=id;pick={};if(mqNarrow.matches)document.body.classList.remove('side-open');loadList();loadDetail()};

/* 决策点表解析：| # | 决策点 | 选项 | 推荐 | 依据 | */
function parseTable(md){
  const rows=[];
  for(const line of (md||'').split('\n')){
    const c=line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(s=>s.trim());
    if(c.length>=5&&/^[D\d]/.test(c[0])&&!/^[-: ]+$/.test(c[1]))rows.push({id:c[0],q:c[1],opts:c[2].split(/[\/、,，]\s*/).filter(Boolean),rec:c[3],why:c[4]});
  }
  return rows;
}
function renderRound(d){
  const n=d.meta.round,tag=String(n).padStart(3,'0');
  const out=d.rounds['r'+tag+'-out.md']||'';
  const inn=d.rounds['r'+tag+'-in.json']||'';
  const conv=/(^|\n)\s*状态[:：]\s*收敛/.test(out);
  let h=`<div style="font-size:12px;color:var(--muted);margin-bottom:8px">第 ${n} 轮 · ${conv?'<b style="color:var(--warn)">已收敛 — 请拍板</b>':'含待拍决策点'}${d.running?' · <b style="color:var(--primary)">⏳ Agent 分析中…</b>':''}</div>`;
  if(inn)h+=`<details style="margin-bottom:10px"><summary style="font-size:12px;color:var(--muted);cursor:pointer">本轮人的输入</summary><div class="doc" style="font-size:12px;color:#525252">${esc(inn)}</div></details>`;
  const rows=parseTable(out);
  if(rows.length){
    h+='<div style="overflow-x:auto"><table class="dt"><tr><th>#</th><th>决策点</th><th>选项（点击拍板）</th><th>推荐</th><th>依据</th></tr>';
    for(const r of rows)h+=`<tr><td><b>${esc(r.id)}</b></td><td>${esc(r.q)}</td><td>${r.opts.map(o=>`<span class="opt ${pick[r.id]===o?'pick':''} ${o===r.rec?'rec':''}" onclick="pick['${r.id}']='${esc(o).replace(/'/g,"&#39;")}';loadDetail()">${esc(o)}</span>`).join('')}</td><td>${esc(r.rec)}</td><td>${esc(r.why)}</td></tr>`;
    h+='</table></div>';
  }
  h+=`<div class="doc" style="font-size:12.5px;color:#404040;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px">${mdHtml(out)||'（本轮暂无产物）'}</div>`;
  return h;
}
function mdHtml(md){
  let h=esc(md);
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre style="background:#f5f5f5;padding:8px;border-radius:6px;font-size:11px;overflow-x:auto">'+c+'</pre>');
  h=h.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/^\s*[-*] (.*)$/gm,'<li>$1</li>');
  h=h.replace(/\|(.+)\|/g,m=>m); // 表格行保留原文
  return h.replace(/\n{2,}/g,'<br><br>');
}
async function loadDetail(){
  if(!cur){return}
  const d=await(await fetch('/api/analyses/'+cur)).json().catch(()=>null);
  if(!d||d.error){$('pane').innerHTML='<div style="color:var(--err)">加载失败</div>';return}
  curIdea=d.meta.idea||'';
  $('tidea').textContent=curIdea.slice(0,60);
  const tp=d.meta.topic?` · 📁 ${d.meta.topic}`:'';
  const pt=d.meta.parent?` · <span title="续接自父话题" style="cursor:pointer" onclick="selSes('${d.meta.parent}')">🔁 续接自 ${d.meta.parent}</span>`:'';
  $('tstate').innerHTML=`${stSpan(d.meta.state,d.meta.submitMode,(d.meta.spawnedRuns||[]).length)} · 第 ${d.meta.round} 轮${tp}${pt}`;
  $('rnb').style.display='';
  if(tab==='round')$('pane').innerHTML=renderRound(d);
  else if(tab==='rounds'){
    let h='';for(const[f,c]of Object.entries(d.rounds))h+=`<details style="margin-bottom:8px"><summary style="font-family:var(--mono);font-size:12px;cursor:pointer">rounds/${esc(f)}</summary><div class="doc" style="font-size:12px">${esc(c).slice(0,4000)}</div></details>`;
    $('pane').innerHTML=h||'（无轮次）';
  }else{
    const c=d.docs[tab];
    $('pane').innerHTML=`<div class="doc">${mdHtml(c)||'（'+tab+'.md 尚未生成）'}</div>`;
  }
  $('matlist').textContent=(d.materials||[]).length?('📎 materials/: '+(d.materials||[]).join(', ')):'';
  $('hint').textContent=d.running?'本轮分析中（reply 会 409）':(d.meta.state==='awaiting'?'已收敛 — 在上方动作栏拍板提交':(['no-go','park'].includes(d.meta.state)?'归档会话：reply 即复活续轮':''));
  renderMgmt(d);
}
/* 话题管理动作栏（全话题统一按钮组，不随状态换脸；唯一差异 = 已立项话题前置 🏭徽章+📜run 历史）：
   🚀提交开发 · 🔧提交升级整改 · 🅿️搁置 · ❌否决 · 🗑删除话题
   继续对话 = reply 续轮，目的就是再次提交：已立项后 🔧整改直建新 run 并累积 spawnedRuns */
function renderMgmt(d){
  if(!cur){$('mgmt').innerHTML='';return}
  const st=d.meta.state,sp=d.meta.spawnedRun,runs=Array.isArray(d.meta.spawnedRuns)?d.meta.spawnedRuns:[];
  let h='';
  if(sp)h+=`<button class="mb" disabled title="spawnedRun 已回写，到 Engineering Factory 管理">🏭 已立项 ${sp}</button>`;
  if(runs.length)h+=`<span class="mats" title="spawnedRuns：${esc(runs.join('，'))}">📜 run 历史 ×${runs.length}</span>`;
  h+=`<button class="mb" style="border-color:var(--primary);color:var(--primary);font-weight:600" onclick="decide('go','build','${st}')">🚀 提交开发</button>`
    +`<button class="mb" onclick="submitFix('${st}')">🔧 提交升级整改</button>`
    +`<button class="mb" onclick="decide('park')">🅿️ 搁置</button>`
    +`<button class="mb" onclick="decide('no-go')">❌ 否决</button>`
    +`<button class="mb danger" onclick="delTopic()">🗑 删除话题</button>`;
  $('mgmt').innerHTML=h;
}
window.delTopic=async id=>{
  const t=id||cur;if(!t)return;
  if(!confirm('硬删除话题 '+t+'（磁盘目录连同轮次/活文档一并删除，不可恢复）？'))return;
  const r=await(await fetch('/api/analyses/'+t+'/delete',{method:'POST'})).json().catch(()=>({}));
  if(!r.ok)return alert('删除失败：'+(r.error||'未知错误'));
  if(t===cur){cur=null;pick={};curIdea='';$('pane').innerHTML='<div style="color:var(--muted);font-size:13px">等待会话…</div>';
    $('tidea').textContent='选择或新建一个分析会话';$('tstate').innerHTML='';$('rnb').style.display='none';renderMgmt(null)}
  loadList();
};
/* 提交升级整改（对象自动跟随话题，不再手填路径）：
   ① 话题有 run 历史 → 按工厂项目索引定位关联项目，一键升级迭代（iterate）
   ② 无 run 历史 → 列工厂项目清单选编号（iterate）；输 / 开头绝对路径则走运维修复（fix） */
window.submitFix=async st=>{
  if(!cur)return;
  const ok=await decide('go','fix',st);if(!ok)return;
  const d=await(await fetch('/api/analyses/'+cur)).json().catch(()=>null);
  const runIds=[...(d&&Array.isArray(d.meta.spawnedRuns)?d.meta.spawnedRuns:[]),
                ...((d&&d.meta.spawnedRun)?[d.meta.spawnedRun]:[])];
  let projs=[];try{projs=(await(await fetch('/api/factory/projects')).json().catch(()=>({}))).projects||[]}catch(e){}
  let mode,repo='',projectId='';
  const mine=projs.find(p=>(p.runs||[]).some(r=>runIds.includes(r)));
  if(mine){ // 话题路径已明确整改对象：直接确认
    mode='iterate';projectId=mine.id;
    if(!confirm('整改对象已随话题定位：项目 '+mine.id+'「'+String(mine.name||'').slice(0,30)+'」（由本话题 run 历史关联）— 建升级迭代 run？'))return;
  }else{
    const list=projs.map((p,i)=>(i+1)+') '+p.id+' '+String(p.name||'').slice(0,24)+'（runs:'+(p.runs||[]).length+'）').join('\n');
    const inp=prompt('本话题无 run 历史 — 选择整改/运维对象：输入项目编号走升级迭代'
      +(list?'\n\n'+list:'\n（工厂暂无项目）')+'\n；或输入 / 开头的仓库绝对路径走运维修复：');
    if(inp===null)return;
    const t=inp.trim(),n=parseInt(t);
    if(projs.length&&String(n)===t&&n>=1&&n<=projs.length){mode='iterate';projectId=projs[n-1].id}
    else if(t.startsWith('/')){mode='fix';repo=t}
    else return alert('没认出对象：请输入项目编号，或以 / 开头的仓库绝对路径');
  }
  const r=await(await fetch('/api/dispatch',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:cur,mode,repo,projectId})})).json().catch(()=>({}));
  if(r.runId)alert('已建整改 run：'+r.runId+'（到 Engineering Factory 看进度）');
  else alert('转整改失败：'+(r.error||'未知错误'));
  loadDetail();loadList();
};
/* 话题改名：prompt 输入新名 → POST /rename → 刷新列表与详情（侧边栏快捷钮可改非当前会话） */
window.renameTopic=async id=>{
  const t=id||cur;if(!t)return;
  const name=prompt('修改话题名（1–80 字）：',(t===cur?curIdea:''));
  if(name===null)return;
  const title=name.trim();
  if(!title)return alert('话题名不能为空');
  const r=await(await fetch('/api/analyses/'+t+'/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})})).json().catch(()=>({}));
  if(!r.ok)return alert('改名失败：'+(r.error||'未知错误'));
  if(t===cur)loadDetail();loadList();
};
document.querySelectorAll('.tb').forEach(t=>t.onclick=()=>{
  tab=t.dataset.t;document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('on',x===t));loadDetail()});

/* 新建（必带话题目录归属；下拉选已有或输入新建） */
$('newbtn').onclick=async()=>{
  const idea=$('idea').value.trim();if(idea.length<5){alert('想法太短（≥5 字）');return}
  const topic=curTopic();
  if(!topic){alert('请先选择或新建话题目录（会话归属）');return}
  $('newbtn').disabled=true;
  const r=await(await fetch('/api/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idea,topic})})).json().catch(()=>({}));
  $('newbtn').disabled=false;
  if(r.id){$('idea').value='';$('topicNew').value='';cur=r.id;pick={};if(mqNarrow.matches)document.body.classList.remove('side-open');loadList();loadDetail()}
  else alert('新建失败：'+(r.error||'未知错误'));
};
/* reply */
$('send').onclick=async()=>{
  if(!cur)return;
  const msg=$('msg').value.trim();
  const fn=$('matfn').value.trim(),ct=$('matct').value;
  const b={answers:pick,message:msg};
  if(fn&&ct)b.materials=[{filename:fn,content:ct}];
  const r=await fetch('/api/analyses/'+cur+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  if(r.status===409){alert('本轮分析进行中，稍候');return}
  if(r.status===400){const e=await r.json();alert('材料非法：'+e.error);return}
  if(r.status===422){alert('reply 需 answers 或 message');return}
  $('msg').value='';$('matfn').value='';$('matct').value='';pick={};
  loadDetail();loadList();
};
/* 拍板：go 全态可用（已立项=再次提交；归档态=复活提交）；sm=submitMode（build/fix），st=提交时状态（用于确认文案） */
const goMsg=(st,sm)=>{
  const base=st==='go'?'该话题已提交过 — 再次提交（先 reply 续轮更新结论更稳）'
    :(['no-go','park'].includes(st)?`确认复活并提交：话题当前为「${st==='no-go'?'NO-GO 否决':'PARK 搁置'}」归档态，直接提交（不续轮，轮次不变）`
    :'确认 GO：话题进入立项池（open 态 = 跳过收敛强制提交；工厂选走或 dispatch 时才建 run）');
  return base+(sm==='fix'?'，本次走升级整改：对象自动随话题 run 历史定位（无需手填路径），建 run 并累积 run 历史':'，本次走开发：待工厂「选话题立项」')+'？'};
window.decide=async(d,sm,st)=>{
  if(!confirm(d==='go'?goMsg(st,sm):d==='withdraw'?'确认撤回：话题回到「待拍板」（工厂尚未选走才允许）？':'确认 '+d.toUpperCase()+'：会话归档（产物保留，可复活）？'))return false;
  const r=await(await fetch('/api/analyses/'+cur+'/decide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:d,submitMode:sm||'build'})})).json();
  if(d==='go'&&!r.ok)alert('拍板失败：'+(r.error||'未知错误'));
  loadDetail();loadList();
  return !!r.ok;
};
renderFilters();loadList();
setInterval(()=>{loadList();if(cur)loadDetail()},6000);
</script>
