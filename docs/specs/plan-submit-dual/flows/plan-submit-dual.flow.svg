<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="-apple-system,'PingFang SC',sans-serif">
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <g font-size="12" fill="#1a1a1a">
    <text x="480" y="22" text-anchor="middle" font-size="15" font-weight="700">Idea Plan · 改名 + 提交双通道（目标结构）</text>

    <!-- R1 rename -->
    <rect x="20" y="40" width="200" height="64" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="120" y="62" text-anchor="middle" font-weight="700">R1 话题改名</text>
    <text x="120" y="80" text-anchor="middle" font-size="10" fill="#64748b">详情 ✏️ / POST /rename</text>
    <text x="120" y="95" text-anchor="middle" font-size="10" fill="#64748b">只写 meta.idea · 轮次不动</text>

    <!-- state machine -->
    <rect x="20" y="150" width="130" height="46" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="85" y="170" text-anchor="middle">归档 no-go/park</text>
    <text x="85" y="186" text-anchor="middle" font-size="10" fill="#64748b">R2：提交按钮恒可见</text>

    <rect x="20" y="230" width="130" height="46" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="85" y="250" text-anchor="middle">awaiting / open</text>
    <text x="85" y="266" text-anchor="middle" font-size="10" fill="#64748b">拍板闸 / 管理栏</text>

    <!-- dual submit -->
    <rect x="240" y="140" width="180" height="150" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/>
    <text x="330" y="162" text-anchor="middle" font-weight="700">R3 提交二选一（人）</text>
    <rect x="255" y="175" width="150" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="330" y="192" text-anchor="middle" font-weight="700">🚀 提交开发</text>
    <text x="330" y="207" text-anchor="middle" font-size="10" fill="#166534">decide go → 立项池（build）</text>
    <rect x="255" y="230" width="150" height="44" rx="8" fill="#ffedd5" stroke="#d97706"/>
    <text x="330" y="246" text-anchor="middle" font-weight="700">🔧 提交升级整改</text>
    <text x="330" y="261" text-anchor="middle" font-size="10" fill="#9a3412">go + dispatch fix（prompt 仓路径）</text>

    <line x1="150" y1="173" x2="238" y2="200" stroke="#64748b" marker-end="url(#ar)"/>
    <line x1="150" y1="253" x2="238" y2="235" stroke="#64748b" marker-end="url(#ar)"/>

    <!-- outcomes -->
    <rect x="480" y="175" width="200" height="60" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="580" y="197" text-anchor="middle" font-weight="700">meta.state=go + submitMode</text>
    <text x="580" y="215" text-anchor="middle" font-size="10" fill="#64748b">build「已提交·开发」/ fix「已提交·整改」</text>
    <text x="580" y="229" text-anchor="middle" font-size="10" fill="#64748b">旧数据无字段按 build 兜底</text>
    <line x1="420" y1="195" x2="478" y2="200" stroke="#64748b" marker-end="url(#ar)"/>

    <rect x="730" y="175" width="210" height="60" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="835" y="197" text-anchor="middle" font-weight="700">工厂承接</text>
    <text x="835" y="215" text-anchor="middle" font-size="10" fill="#64748b">build→立项池选走 · fix→from-plan 直建 run</text>
    <text x="835" y="229" text-anchor="middle" font-size="10" fill="#64748b">spawnedRun 回写照旧（不动）</text>
    <line x1="680" y1="205" x2="728" y2="205" stroke="#64748b" marker-end="url(#ar)"/>

    <!-- guard -->
    <rect x="480" y="60" width="460" height="56" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="710" y="80" text-anchor="middle" font-size="11" fill="#64748b">护栏：提交按钮永不消失（go/spawnedRun 态显示「再次提交」，再提交=派新 run，spawnedRuns[] 追加）；</text>
    <text x="710" y="98" text-anchor="middle" font-size="11" fill="#64748b">归档直接提交补 revive 日志可审计；轮次协议 / agentStream / 五态状态机本体 / 工厂侧零改动（do_not_touch）</text>
    <line x1="420" y1="160" x2="478" y2="105" stroke="#cbd5e1" stroke-dasharray="4 3"/>

    <text x="480" y="325" text-anchor="middle" font-size="10" fill="#64748b">flows 定稿件 · plan-submit-dual v1 · 2026-11-17 · 裁定：直接提交 / prompt 仓路径 / submitMode 字段</text>
  </g>
</svg>
