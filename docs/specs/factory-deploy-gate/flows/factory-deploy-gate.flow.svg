<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="-apple-system,'PingFang SC',sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <style>
    .n{fill:#fff;stroke:#cbd5e1;rx:10}
    .t{font-size:13px;fill:#1a1a1a;text-anchor:middle}
    .s{font-size:10px;fill:#64748b;text-anchor:middle}
    .gate{stroke:#dc2626;stroke-width:2}
    .ok{stroke:#16a34a;stroke-width:2}
    .e{stroke:#64748b;fill:none;marker-end:url(#ar)}
  </style>
  <text x="480" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Factory · deploy 上线人批闸（目标结构 · 三链一致）</text>

  <!-- main chain -->
  <g>
    <rect class="n" x="20" y="60" width="110" height="52" rx="10"/><text class="t" x="75" y="82">delivery</text><text class="t" x="75" y="100" font-size="11">交付验收</text>
    <rect class="n gate" x="180" y="60" width="130" height="52" rx="10"/><text class="t" x="245" y="82">deploy 闸</text><text class="t" x="245" y="100" font-size="11">owner = 👤 人</text>
    <rect class="n" x="360" y="60" width="130" height="52" rx="10"/><text class="t" x="425" y="82">pushIfPossible</text><text class="t" x="425" y="100" font-size="11">推送远程（现函数不动）</text>

    <line class="e" x1="130" y1="86" x2="178" y2="86"/>
    <line class="e" x1="310" y1="86" x2="358" y2="86"/>

    <!-- gate outcomes -->
    <rect class="n ok" x="200" y="170" width="90" height="44" rx="10"/><text class="t" x="245" y="190" font-size="12">go 批准</text><text class="t" x="245" y="205" font-size="10">→ 执行推送</text>
    <rect class="n" x="330" y="170" width="90" height="44" rx="10"/><text class="t" x="375" y="190" font-size="12">redo 跳过</text><text class="t" x="375" y="205" font-size="10">保持已交付·未上线</text>
    <rect class="n" x="460" y="170" width="120" height="44" rx="10"/><text class="t" x="520" y="190" font-size="12">未绑定远程</text><text class="t" x="520" y="205" font-size="10">如实落账「未上线」</text>

    <line class="e" x1="235" y1="112" x2="245" y2="168"/>
    <line class="e" x1="255" y1="112" x2="370" y2="168"/>
    <line class="e" x1="295" y1="98" x2="500" y2="168"/>

    <!-- end states -->
    <rect class="n ok" x="560" y="60" width="150" height="52" rx="10"/><text class="t" x="635" y="82">✅ 已交付 · 已上线</text><text class="t" x="635" y="100" font-size="11">pushed=true + 远程地址</text>
    <line class="e" x1="490" y1="86" x2="558" y2="86"/>
    <rect class="n" x="640" y="170" width="150" height="44" rx="10"/><text class="t" x="715" y="190" font-size="12">✅ 已交付 · ⏸ 未上线</text><text class="t" x="715" y="205" font-size="10">看板双态徽章（永不冒充）</text>
    <line class="e" x1="420" y1="192" x2="638" y2="192"/>
    <line class="e" x1="580" y1="192" x2="638" y2="192"/>

    <!-- compatibility note -->
    <rect class="n" x="740" y="50" width="200" height="72" rx="10"/>
    <text class="t" x="840" y="72" font-size="12">兼容恢复</text>
    <text class="s" x="840" y="90">旧 run nodes.json 缺 deploy 位</text>
    <text class="s" x="840" y="105">restore 按链长补 pending；已 done 不回填不重推</text>
  </g>

  <text class="s" x="480" y="275">flows 定稿件 · factory-deploy-gate v1 · 2026-11-17 · 人批 D1/三链一致/redo=跳过/P-016 补推</text>
</svg>
